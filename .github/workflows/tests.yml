# Минимальный CI (пункт 0.3 дороги рефакторинга, стенд СТ1).
#
# Два вопроса, и оба — гейты плана:
#   1. сбор pytest проходит без ошибок (пункт 0.0: один модуль, испортивший
#      sys.modules, роняет сборку всех следующих за ним);
#   2. новых красных нет относительно зафиксированной базы
#      (tools/bench/suite_baseline.json) — набор красный не весь, и «ноль
#      красных» гейтом быть не может, пока 58 падений не разобраны.
#
# Пункт 0.10 добавил два храповика той же формы (эталон в git, --check → exit 1):
#   3. долг широких except не растёт (tools/lint_gate.py);
#   4. воспроизводимость раскладки не деградирует (tools/layout_determinism.py)
#      на трёх графах корпуса из git.
#
# Пункт ГЕЙТ-1: у стенда воспроизводимости ТРИ исхода (PROTOCOL §5). Эталон
# покрывает 19 графов, в git лежат 3 — здесь стенд отдаёт exit 2 «судить нечем»
# и это НЕ провал сборки: вердикт по корпусу выносит только локальный прогон
# (замер 0.8). Регресс на видимых трёх — по-прежнему exit 1 и красное CI.
#
# Пункт 1-30: прощается не всякая двойка, а только «корпус усечён». С этого
# пункта убитый дочерний прогон тоже отвечает «судить нечем» (раньше он умирал
# трейсбеком с кодом 1), и без разбора причины он проехал бы в CI зелёным
# warning'ом. Причину стенд печатает последней строкой — unjudged=corpus либо
# unjudged=environment; вторая роняет сборку.
#
# Пункт 1-30 же: у suite_baseline.py --check появился третий исход. exit 2 —
# «мерить было нечем» (сбор сломан — это пункт 0.0; прогон убит; git молчит),
# exit 1 — «в наборе новый красный». Шаг падает на обеих: ненулевой код есть
# ненулевой, менялся диагноз, а не цвет.
#
# Раннер windows-latest: база снята на Windows, обе машины разработки — Windows.
# Linux-прогон (боевой воркер живёт в Linux-контейнере) потребует своей базы —
# это отдельная работа, не этот пункт.
#
# Торч и ultralytics не ставятся: замерено, что набору они не нужны
# (единственный потребитель, tests/test_ocr_phase0.py, в collect_ignore).
# shapely приезжает из requirements/dev.txt (пункт 0.3x перенёс его туда из
# строки workflow): без него 22 теста раскладки молча исчезают из сбора.
#
# Версии — из requirements/constraints-ci.txt (пункт 0.3x). Требования проекта
# заданы через `>=`, поэтому без constraints состав окружения решает дата
# прогона: любой апстрим-релиз или ротация образа windows-latest красит набор,
# и красное CI будет означать «мир поехал», а не «правка сломала». Пересъём
# constraints — осознанный шаг, как пересъём базовой линии.
name: tests

on:
  push:
    branches: [dev, main, 'road/**']
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: windows-latest
    # ⛔ Потолок задания обязан быть ВЫШЕ `RUN_TIMEOUT` стенда
    # (`tools/suite_baseline.py`), иначе GitHub убьёт задание раньше, чем стенд
    # успеет отдать свой `exit 2` «судить нечем», — и третий исход пункта 1-47
    # в CI снова станет неотличим от оборванного задания. Было 30 минут при
    # `RUN_TIMEOUT = 900`; после роста набора 3036 → 4284 потолок стенда стал
    # 1800 с, то есть СРАВНЯЛСЯ с прежним бюджетом задания. 45 минут держат
    # порядок `TEST_TIMEOUT (120) < RUN_TIMEOUT (1800) < задание (2700)`
    # и оставляют ~900 с на прочие шаги: установку зависимостей, сбор,
    # `lint_gate`, воспроизводимость раскладки.
    # ⚠ Двигая одно из трёх чисел, сверяй два других.
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Зависимости (api + ui + dev, CPU-only, версии из constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-ci.txt -r requirements/api.txt -r requirements/ui.txt -r requirements/dev.txt

      - name: Сбор pytest без ошибок
        run: python -m pytest --collect-only -q

      - name: Базовая линия набора — новых красных нет
        run: python tools/suite_baseline.py --check

      - name: Линтеры — долг широких except не вырос
        run: python tools/lint_gate.py --check

      - name: Воспроизводимость раскладки — регресса нет
        shell: bash
        run: |
          set +e
          python tools/layout_determinism.py --git-only --runs 10 --check > determinism.log 2>&1
          rc=$?
          set -e
          cat determinism.log
          if [ "$rc" = "2" ] && grep -q "unjudged=corpus" determinism.log; then
            echo "::warning title=Стенд не судит::в git 3 графа корпуса из 19 — вердикт по воспроизводимости даёт только локальный прогон (PROTOCOL §5)"
            exit 0
          fi
          exit $rc
