# Минимальный CI (пункт 0.3 дороги рефакторинга, стенд СТ1).
#
# Два вопроса, и оба — гейты плана:
#   1. сбор pytest проходит без ошибок (пункт 0.0: один модуль, испортивший
#      sys.modules, роняет сборку всех следующих за ним);
#   2. новых красных нет относительно зафиксированной базы
#      (tools/bench/suite_baseline.json) — набор красный не весь, и «ноль
#      красных» гейтом быть не может, пока 58 падений не разобраны.
#
# Пункт 0.10 добавил два храповика той же формы (эталон в git, --check → exit 1):
#   3. долг широких except не растёт (tools/lint_gate.py);
#   4. воспроизводимость раскладки не деградирует (tools/layout_determinism.py)
#      на трёх графах корпуса из git.
#
# Раннер windows-latest: база снята на Windows, обе машины разработки — Windows.
# Linux-прогон (боевой воркер живёт в Linux-контейнере) потребует своей базы —
# это отдельная работа, не этот пункт.
#
# Торч и ultralytics не ставятся: замерено, что набору они не нужны
# (единственный потребитель, tests/test_ocr_phase0.py, в collect_ignore).
# shapely приезжает из requirements/dev.txt (пункт 0.3x перенёс его туда из
# строки workflow): без него 22 теста раскладки молча исчезают из сбора.
#
# Версии — из requirements/constraints-ci.txt (пункт 0.3x). Требования проекта
# заданы через `>=`, поэтому без constraints состав окружения решает дата
# прогона: любой апстрим-релиз или ротация образа windows-latest красит набор,
# и красное CI будет означать «мир поехал», а не «правка сломала». Пересъём
# constraints — осознанный шаг, как пересъём базовой линии.
name: tests

on:
  push:
    branches: [dev, main, 'road/**']
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Зависимости (api + ui + dev, CPU-only, версии из constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-ci.txt -r requirements/api.txt -r requirements/ui.txt -r requirements/dev.txt

      - name: Сбор pytest без ошибок
        run: python -m pytest --collect-only -q

      - name: Базовая линия набора — новых красных нет
        run: python tools/suite_baseline.py --check

      - name: Линтеры — долг широких except не вырос
        run: python tools/lint_gate.py --check

      - name: Воспроизводимость раскладки — регресса нет
        run: python tools/layout_determinism.py --git-only --runs 10 --check
