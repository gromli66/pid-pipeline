# =============================================================================
# docker-compose.override.yml — автоподхватывается docker compose.
# Не трогает основной docker-compose.yml. Дельты Д2/Д4/Д5.
# =============================================================================

services:
  # Д2: правильная ссылка на CVAT для клиента — нужна И api, И worker.
  api:
    environment:
      - CVAT_BROWSER_URL=${CVAT_BROWSER_URL:-http://localhost:8080}
  worker:
    environment:
      - CVAT_BROWSER_URL=${CVAT_BROWSER_URL:-http://localhost:8080}

  # Д4: CSRF при сохранении (раскомментировать, если save в CVAT не проходит по IP).
  # Точное имя переменной сверить с докой CVAT v2.25.0.
  # cvat_server:
  #   environment:
  #     CSRF_TRUSTED_ORIGINS: "http://REPLACE_WITH_SERVER_IP:8080"

# Д5: воркеры на CPU — GPU-блок deploy.resources.reservations.devices
# нельзя убрать через override, его комментируют прямо в docker-compose.yml
# (worker ~139-145, worker_ocr ~180-186) + в .env PID_DEVICE=cpu, YOLO_DEVICE=cpu.
