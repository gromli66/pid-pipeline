# profiles/isa_s5.yaml — ISA S5.1 Instrument Tags
#
# Примеры тегов: FIC-101, LT-200A, PDI-3001
# Line numbers: 6"-HCA-001, 10"-PW-100
#
# Используется с ISAProfile из isa_s5.py

name: "ISA S5.1 Instrument Tags"
version: "1.0"
languages: ["en"]

units: []  # ISA не использует KKS-юниты

patterns:
  full_tag:
    regex: '\b([A-Z]{2,4})-(\d{3,4}[A-Z]?)\b'
    flags: "IGNORECASE"
    role: "full"
    min_length: 5

  prefix:
    regex: '\b([A-Z]{2,4})-?\s*$'
    flags: "IGNORECASE"
    role: "head"

  suffix:
    regex: '^\d{3,4}[A-Z]?\b'
    role: "tail"

  line_number:
    regex: '\b\d{1,2}"-[A-Z]{2,5}-\d{3,5}\b'
    role: "standalone"

grouping:
  passes:
    - name: "full_tags"
      source: ["FULL"]
      action: "emit"

    - name: "lines"
      source: ["LINE"]
      action: "emit"

    - name: "prefix_to_suffix"
      source: ["HEAD"]
      target: ["TAIL"]
      max_distance: 2.0
      direction: "any"
      x_overlap_min: 0.2
      action: "merge_and_emit"

noise:
  rules:
    - name: "revision"
      regex: 'REV\.\s*\d|REVISION'
      flags: "IGNORECASE"
    - name: "date"
      regex: '^\d{1,2}[./]\d{1,2}[./]\d{2,4}$'
    - name: "drawing_number"
      regex: 'DWG\s*#|DRAWING\s*NO'
      flags: "IGNORECASE"

char_normalization:
  enabled: false
