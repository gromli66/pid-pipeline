# =============================================================================
# P&ID Node Detection - Default Configuration
# =============================================================================
#
# Этот файл содержит все настройки пайплайна детекции узлов на P&ID схемах.
# 
# ИСПОЛЬЗОВАНИЕ:
#   1. Скопируйте этот файл: cp default.yaml my_config.yaml
#   2. Отредактируйте пути и параметры под вашу задачу
#   3. Запустите: python -m pid_node_detection train --config my_config.yaml
#
# СТРУКТУРА:
#   - paths: все пути к данным и результатам
#   - preprocessing: параметры предобработки изображений
#   - splitting: параметры разбиения данных
#   - tiling: параметры нарезки на тайлы
#   - augmentation: параметры аугментации (CPA, rotation)
#   - training: параметры обучения YOLO
#   - inference: параметры инференса с SAHI
#   - evaluation: параметры оценки модели
# =============================================================================

# -----------------------------------------------------------------------------
# ПУТИ К ДАННЫМ
# -----------------------------------------------------------------------------
# Все пути могут быть абсолютными или относительными (от рабочей директории)
paths:
  # === ВХОДНЫЕ ДАННЫЕ ===
  
  # Директория с исходными изображениями схем
  # Ожидаемый формат: PNG/JPG, 300 DPI, ~4900x3500 px
  raw_images: "./data/raw/images"
  
  # Директория с исходными YOLO-аннотациями
  # Формат: txt файлы с тем же именем, что и изображения
  # Содержимое: class_id x_center y_center width height (нормализованные)
  raw_labels: "./data/raw/labels"
  
  # === МАСКИ ДЛЯ COPY-PASTE АУГМЕНТАЦИИ ===
  # ОПЦИОНАЛЬНО: без масок CPA будет вставлять объекты случайно
  # С масками - избегает труб и аннотаций
  
  # Маски труб (бинарные, белый = труба)
  # Генерируются модулем сегментации труб
  pipe_masks: "./data/masks/pipes"
  
  # Маски текстовых аннотаций (бинарные, белый = аннотация)
  # Генерируются модулем сегментации аннотаций
  annotation_masks: "./data/masks/annotations"
  
  # === ВЫХОДНЫЕ ДАННЫЕ ===
  
  # Рабочая директория для промежуточных результатов
  # Здесь создаются поддиректории для каждого этапа пайплайна
  work_dir: "./data_yolo_node/processed"

  # Директория для подготовленного датасета (train/val/test splits)
  dataset_dir: "./data_yolo_node/dataset"

  # Директория для результатов обучения (веса, логи, графики)
  experiments_dir: "./result_yolo_node/experiments"

  # Директория для результатов инференса
  inference_output: "./result_yolo_node/output/predictions"

  # Директория для статистики и отчетов
  statistics_dir: "./result_yolo_node/output/statistics"

# -----------------------------------------------------------------------------
# ПРЕДОБРАБОТКА ИЗОБРАЖЕНИЙ
# -----------------------------------------------------------------------------
preprocessing:
  # Конвертация в grayscale
  # ВАЖНО: все этапы (train/test/inference) должны использовать одинаковую предобработку
  grayscale: true
  
  # Расширения файлов для обработки
  image_extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"

# -----------------------------------------------------------------------------
# РАЗБИЕНИЕ ДАННЫХ
# -----------------------------------------------------------------------------
splitting:
  # Доля данных для тестовой выборки (от всего датасета)
  # Test выделяется ДО тайлинга на уровне целых схем
  test_ratio: 0.2

  # Доля данных для валидации (от train+val после тайлинга)
  val_ratio: 0.3

  # Random seed для воспроизводимости
  random_seed: 42

  # Стратифицированное разбиение
  # Гарантирует наличие редких классов в train и val
  stratified: true

# -----------------------------------------------------------------------------
# ТАЙЛИНГ (НАРЕЗКА НА ФРАГМЕНТЫ)
# -----------------------------------------------------------------------------
# Применяется к train/val данным для обучения на фрагментах
# Test остается в оригинальном размере (SAHI сам режет при инференсе)
tiling:
  # Размер тайла в пикселях
  # 1280 оптимально для YOLOv8 и стандартных P&ID схем 300 DPI
  tile_size: 1280

  # Перекрытие между соседними тайлами (0-1)
  # 0.25 = 25% перекрытия, помогает не терять объекты на границах
  overlap: 0.25

  # Минимальная видимая площадь объекта для включения в тайл (0-1)
  # Объекты с меньшей видимой площадью отбрасываются
  # 0.6 = объект должен быть виден минимум на 60%
  min_visible_ratio: 0.6

  # Доля пустых тайлов (без объектов) для сохранения
  # Помогает модели не детектировать ложные срабатывания на пустых областях
  keep_empty_ratio: 0.1

  # Создавать forbidden маски для CPA
  # Маски показывают зоны, куда нельзя вставлять объекты
  create_forbidden_masks: true

  # Размер ядра для дилатации forbidden масок (расширение запретных зон)
  forbidden_mask_dilation: 7

# -----------------------------------------------------------------------------
# АУГМЕНТАЦИЯ
# -----------------------------------------------------------------------------
augmentation:
  # --- COPY-PASTE AUGMENTATION ---
  # Вставка вырезанных объектов редких классов на тайлы
  copy_paste:
    # Включить CPA
    # ВАЖНО: требует наличия масок (paths.pipe_masks, paths.annotation_masks)
    enabled: true

    # Правила размещения объектов (в сумме должно быть 1.0)
    placement_rules:
      full_visible: 0.70    # Полностью видимый объект
      partial_80_90: 0.20   # Частично видимый (80-90%)
      occlusion: 0.10       # С перекрытием

    # Максимум попыток найти позицию для вставки
    max_attempts: 50

    # Максимальная доля forbidden зоны под объектом
    # Если больше - позиция отклоняется
    forbidden_threshold: 0.10

    # Минимальный размер объекта для вставки (px)
    min_object_size: 20

    # Параметры внутренних аугментаций при CPA
    internal_augmentation:
      rotation_angles: [0, 90, 180, 270]  # Повороты
      brightness_range: [-15, 15]          # Диапазон изменения яркости
      brightness_prob: 0.5                 # Вероятность изменения яркости
      thickness_prob: 0.3                  # Вероятность изменения толщины линий
      thickness_operations: ["erode", "dilate"]
      thickness_kernel_sizes: [2, 3]
      binarization_prob: 0.2               # Вероятность адаптивной бинаризации

    # Параметры синтетических тайлов
    # Создаются для больших объектов, которые не помещаются на существующие тайлы
    synthetic_tiles:
      enabled: true
      max_tiles: 300
      objects_per_tile: [3, 8]  # min, max объектов на синтетический тайл

  # --- ROTATION AUGMENTATION ---
  # Повороты на 90°, 180°, 270°
  rotation:
    enabled: true

    # Режимы:
    # - "all": все 3 поворота + оригинал = 4x данных
    # - "random_1": случайный 1 поворот + оригинал = 2x данных
    # - "random_2": случайные 2 поворота + оригинал = 3x данных
    mode: "all"

    # Углы поворота
    angles: [90, 180, 270]

# -----------------------------------------------------------------------------
# ОБУЧЕНИЕ
# -----------------------------------------------------------------------------
training:
  # Базовая модель YOLO
  # Рекомендации:
  # - yolov8n.pt: быстрая, для тестов
  # - yolov8s.pt: баланс скорость/качество
  # - yolov8m.pt: рекомендуется для P&ID
  # - yolov8l.pt: для максимального качества
  model: "yolov8m.pt"

  # Количество эпох
  epochs: 100

  # Размер батча (зависит от GPU памяти)
  # RTX 4070 (12GB): batch=4 для img_size=1280
  batch_size: 4

  # Размер входного изображения
  # Должен соответствовать tile_size
  img_size: 1280

  # Early stopping: остановка если нет улучшения N эпох подряд
  patience: 25

  # Оптимизатор
  optimizer: "AdamW"

  # Начальный learning rate
  lr0: 0.001

  # Финальный learning rate (множитель от lr0)
  lrf: 0.01

  # Weight decay для регуляризации
  weight_decay: 0.0005

  # Loss веса
  loss_weights:
    box: 7.5   # Вес локализации
    cls: 0.5   # Вес классификации
    dfl: 1.5   # Вес distribution focal loss

  # Встроенные аугментации YOLO
  # scale и translate включены для компенсации различий в размерах символов
  # между разными стилями P&ID схем
  builtin_augmentation:
    enabled: true
    degrees: 0
    translate: 0.05
    scale: 0.15
    flipud: 0
    fliplr: 0
    mosaic: 0
    mixup: 0

  # Сохранение чекпоинтов каждые N эпох
  save_period: 10

  # GPU устройство (0, 1, ... или "cpu")
  device: 0

# -----------------------------------------------------------------------------
# FINETUNE
# -----------------------------------------------------------------------------
# Finetune = адаптация к новому стилю схем
# Логика:
#   1. Старые (raw): 2 → test, остальные → train/val
#   2. Новые: 2 → test, остальные → train/val
#   3. Препроцессинг → тайлинг → CPA → rotation
#   4. Rotation раздельно: old="all"(4x), new="random_1"(2x) → баланс ~35:65
#   5. Обучение (finetune или с нуля)
finetune:
  # === ПУТИ К ДАННЫМ ===

  # Путь к весам модели для дообучения
  # Можно указать здесь или через CLI: --weights path/to/best.pt
  weights: "./result_yolo_node/experiments/baseline_start/weights/best.pt"

  # Старые данные (исходники для полного препроцессинга)
  old_images: "./data/raw/images"
  old_labels: "./data/raw/labels"

  # Новые данные для дообучения
  new_images: "./data/finetune/images"
  new_labels: "./data/finetune/labels"

  # === РАЗБИЕНИЕ ===

  # Доля схем в val (от каждого источника отдельно)
  val_ratio: 0.15

  # Количество схем в test от каждого источника
  test_count_per_source: 2

  # === ПАРАМЕТРЫ ОБУЧЕНИЯ ===

  # Learning rate: средний между train (0.001) и мягким finetune (0.0001)
  # Позволяет адаптироваться к новому стилю, не разрушая базовые фичи
  lr0: 0.0001

  epochs: 20
  patience: 10

# -----------------------------------------------------------------------------
# ИНФЕРЕНС
# -----------------------------------------------------------------------------
inference:
  # Путь к весам модели
  # Оставьте пустым для указания через CLI: --weights path/to/best.pt
  weights: "./result_yolo_node/experiments/baseline_start/weights/best.pt"

  # Использование SAHI для слайсинга больших изображений
  use_sahi: true

  # Базовый порог уверенности
  confidence_threshold: 0.8
  
  # Порог IoU для NMS
  iou_threshold: 0.5
  
  # Устройство
  device: "cuda"
  
  # Адаптивные параметры слайсинга
  # Автоматически подбираются под размер изображения
  adaptive_slicing:
    enabled: true
    # Таблица параметров: max_dimension -> (slice_size, overlap)
    # Подбирает оптимальные параметры для ~50 слайсов на изображение
    size_table:
      5000:  [1280, 0.25]
      8000:  [1280, 0.25]
      11000: [1280, 0.25]
      16000: [1280, 0.25]
      23000: [1280, 0.25]
      99999: [1280, 0.25]
  
  # Фиксированные параметры (если adaptive_slicing.enabled: false)
  fixed_slicing:
    slice_size: 1280
    overlap: 0.25
  
  # Переименование классов в выходных файлах
  # Применяет reverse_reindex_mapping из classes.yaml
  apply_reverse_mapping: true

# -----------------------------------------------------------------------------
# ОЦЕНКА МОДЕЛИ (TEST)
# -----------------------------------------------------------------------------
evaluation:
  # Порог IoU для matching предсказаний с ground truth
  iou_threshold: 0.5
  
  # Пороги уверенности для анализа
  confidence_thresholds:
    - 0.5
    - 0.6
    - 0.7
    - 0.8
    - 0.9
  
  # Сохранять confusion matrix
  save_confusion_matrix: true
  
  # Сохранять per-class метрики в CSV
  save_per_class_metrics: true
  
  # Визуализация
  visualization:
    # Сохранять изображения с детекциями
    save_predictions: true
    # Максимум изображений для визуализации
    max_images: 20

# -----------------------------------------------------------------------------
# СТАТИСТИКА
# -----------------------------------------------------------------------------
statistics:
  # Порог для определения редкого класса
  rare_threshold: 50
  
  # Сохранять детальную статистику на каждом этапе
  save_intermediate: true