# =============================================================================
# P&ID Node Detection - Class Configuration
# =============================================================================
# 
# Этот файл содержит маппинг классов для детекции узлов на P&ID схемах.
# 
# ВАЖНО: 
# - В исходных данных классы 34, 36, 37 удаляются (annotation, truba, unknown)
# - После удаления происходит переиндексация: 35→34 (output), 38→35 (strelka)
# - Итого 36 классов (0-35)
#
# Категории классов:
# - Арматура (0, 3, 8, 10): ручная, электро, серопривод, мембранная
# - Клапаны (1, 7, 13): обратный, обратный серопривод, предохранительный
# - Регуляторы (2, 4, 9): ручной, электро, серопривод
# - Насосы (11, 16): обычный, водоструйный
# - Теплообменное оборудование (17, 24, 25, 28, 29): теплообменник, каплеуловитель, 
#   цилиндр турбины, сепаратор паро, деаэратор
# - Емкости (20, 21, 23): бак, воронка, сепаратор
# - Фильтры (22): механический
# - Компенсаторы (30): сильфонный
# - Прочее оборудование (5, 6, 14, 15, 18, 19, 26, 27, 31, 32, 33, 34, 35)
# =============================================================================

# Количество классов после очистки данных
num_classes: 36

# Основной маппинг: id → имя класса
# Используется при обучении и инференсе
class_names:
  0: "armatura_ruchn"           # Арматура ручная
  1: "klapan_obratn"            # Клапан обратный
  2: "regulator_ruchn"          # Регулятор ручной
  3: "armatura_electro"         # Арматура электропривод
  4: "regulator_electro"        # Регулятор электропривод
  5: "drossel"                  # Дроссель
  6: "perehod"                  # Переход
  7: "klapan_obratn_seroprivod" # Клапан обратный серопривод
  8: "armatura_seroprivod"      # Арматура серопривод
  9: "regulator_seroprivod"     # Регулятор серопривод
  10: "armatura_membr_electro"  # Арматура мембранная электро
  11: "nasos"                   # Насос
  12: "ventilaytor"             # Вентилятор
  13: "predohran"               # Предохранительный клапан
  14: "condensatootvod"         # Конденсатоотводчик
  15: "rashodomernaya_shaiba"   # Расходомерная шайба
  16: "vodostruiniy_nasos"      # Водоструйный насос
  17: "teploobmen"              # Теплообменник
  18: "zaglushka"               # Заглушка
  19: "gidrozatvor"             # Гидрозатвор
  20: "bak"                     # Бак
  21: "voronka"                 # Воронка
  22: "filtr_meh"               # Фильтр механический
  23: "separator"               # Сепаратор
  24: "kapleulov"               # Каплеуловитель
  25: "celindr_turb"            # Цилиндр турбины
  26: "redukcion_ustr"          # Редукционное устройство
  27: "bistro_redukc_ustr"      # Быстродействующее редукционное устройство
  28: "separator_paro"          # Сепаратор паро
  29: "dearator"                # Деаэратор
  30: "silfonnii_kompensator"   # Сильфонный компенсатор
  31: "electronagrevat"         # Электронагреватель
  32: "smotrowoe_steclo"        # Смотровое стекло
  33: "datchik"                 # Датчик
  34: "output"                  # Выход
  35: "strelka"                 # Стрелка направления

# Классы, которые удаляются из исходных данных
# Причины удаления:
# - 34 (annotation): служебные аннотации, не являются оборудованием
# - 36 (truba): трубы обрабатываются отдельным модулем сегментации
# - 37 (unknown): неизвестные объекты, создают шум в данных
classes_to_remove:
  - 34  # annotation
  - 36  # truba  
  - 37  # unknown

# Маппинг переиндексации после удаления классов
# Применяется к labels после тренировки перед финальным сохранением
reindex_mapping:
  35: 34  # output: было 35, стало 34
  38: 35  # strelka: было 38, стало 35

# Обратный маппинг для инференса (когда модель выдает 34, 35 → нужно вернуть 35, 38)
# Используется при экспорте результатов в формат совместимый с исходной разметкой
reverse_reindex_mapping:
  34: 35  # output
  35: 38  # strelka

# Редкие классы - требуют особого внимания при аугментации
# Критерий: менее 50 примеров в исходном датасете
rare_classes:
  - 7   # klapan_obratn_seroprivod
  - 9   # regulator_seroprivod
  - 10  # armatura_membr_electro
  - 12  # ventilaytor
  - 14  # condensatootvod
  - 16  # vodostruiniy_nasos
  - 18  # zaglushka
  - 19  # gidrozatvor
  - 23  # separator
  - 24  # kapleulov
  - 26  # redukcion_ustr
  - 27  # bistro_redukc_ustr
  - 28  # separator_paro
  - 29  # dearator
  - 30  # silfonnii_kompensator
  - 31  # electronagrevat
  - 32  # smotrowoe_steclo

# Критически редкие классы - получают больше аугментаций
# Критерий: менее 20 примеров в исходном датасете
critical_classes:
  - 10  # armatura_membr_electro
  - 12  # ventilaytor
  - 16  # vodostruiniy_nasos
  - 19  # gidrozatvor
  - 23  # separator
  - 26  # redukcion_ustr
  - 28  # separator_paro
  - 29  # dearator
  - 31  # electronagrevat

# Целевое количество примеров после Copy-Paste аугментации
augmentation_targets:
  rare_classes: 150      # Для редких классов
  critical_classes: 200  # Для критически редких классов
