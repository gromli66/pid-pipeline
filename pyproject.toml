# Конфиг линтеров (ПР5 мастер-плана, пункт 0.10 дороги рефакторинга).
#
# `ruff` и `mypy` стояли в `requirements/dev.txt` без единого конфига — то есть
# не запускались. Здесь только то, что уже решено планом; набор правил
# расширяется решением, а не дрейфом.
#
# Гейт — `tools/lint_gate.py` (эталон `tools/bench/lint_baseline.json`):
# «голый» `ruff check` печатает весь накопленный долг и красен по определению,
# поэтому судит не он, а храповик — счётчик нарушений по файлам не имеет права
# расти. Долг при этом виден: `python -m ruff check --statistics`.
#
# Пакетом проект не собирается (`pip install .` нигде не вызывается) — секции
# `[build-system]`/`[project]` намеренно отсутствуют.

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "vendor",       # чужой код: SWIG-прокси adaptagrams
    "_scratch",     # стенды R&D, вне git
    ".venv311",     # сборочная среда клиента (СТ11)
    ".venv_build",
    "claude-course",
]

[tool.ruff.lint]
# ПР5: одно правило останавливает рост долга в 200 широких `except`.
# BLE001 — `except Exception`, E722 — голый `except:`; это одна и та же болезнь.
# Осознанный широкий перехват в проекте уже помечается `# noqa: BLE001 — причина`
# (10 мест на 2026-08-18) — эта идиома и становится обязательной.
select = ["BLE001", "E722"]

[tool.mypy]
# «mypy на новых модулях» (ПР5): типизированный DTO ловит расхождение строковых
# ключей `graph_val`/`val_graph` проверкой, а не потерей листа у оператора.
# Список `files` — храповик по включению: сюда попадает то, что проходит начисто;
# новый модуль автор добавляет сам. Разворачивать на весь репозиторий бессмысленно —
# это работа этапа 12/13, а не пункта опоры.
python_version = "3.11"
ignore_missing_imports = true      # torch/cv2/PySide6 без стабов на CI
follow_imports = "silent"          # соседний нетипизированный модуль не красит наш
files = [
    "modules/graph/core/contours_merge.py",
    "tools/corpus.py",
    "tools/edit_bench.py",
    "tools/lint_gate.py",
    "tools/layout_determinism.py",
    "tools/pair_bench.py",
    "tools/suite_baseline.py",
]
