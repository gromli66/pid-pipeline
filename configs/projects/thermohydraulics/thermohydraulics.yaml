# =============================================================================
# P&ID Pipeline - Проект "Термогидравлика"
# =============================================================================

project:
  name: "Термогидравлика"
  code: "thermohydraulics"
  save_visualizations: false    # true = save debug overlays (slow), false = skip

cvat:
  project_name: "P&ID Термогидравлика"

# =============================================================================
# Классы проекта (для CVAT, 1-based)
# =============================================================================
