# =============================================================================
# P&ID Pipeline - Проект "Термогидравлика"
# =============================================================================

project:
  name: "Термогидравлика"
  code: "thermohydraulics"
  save_visualizations: false    # true = save debug overlays (slow), false = skip

cvat:
  project_name: "P&ID Термогидравлика"

# =============================================================================
# Классы проекта (для CVAT, 1-based)
# =============================================================================
classes:
  - {id: 1, name: "armatura_ruchn"}
  - {id: 2, name: "klapan_obratn"}
  - {id: 3, name: "regulator_ruchn"}
  - {id: 4, name: "armatura_electro"}
  - {id: 5, name: "regulator_electro"}
  - {id: 6, name: "drossel"}
  - {id: 7, name: "perehod"}
  - {id: 8, name: "klapan_obratn_seroprivod"}
  - {id: 9, name: "armatura_seroprivod"}
  - {id: 10, name: "regulator_seroprivod"}
  - {id: 11, name: "armatura_membr_electro"}
  - {id: 12, name: "nasos"}
  - {id: 13, name: "ventilaytor"}
  - {id: 14, name: "predohran"}
  - {id: 15, name: "condensatootvod"}
  - {id: 16, name: "rashodomernaya_shaiba"}
  - {id: 17, name: "vodostruiniy_nasos"}
  - {id: 18, name: "teploobmen"}
  - {id: 19, name: "zaglushka"}
  - {id: 20, name: "gidrozatvor"}
  - {id: 21, name: "bak"}
  - {id: 22, name: "voronka"}
  - {id: 23, name: "filtr_meh"}
  - {id: 24, name: "separator"}
  - {id: 25, name: "kapleulov"}
  - {id: 26, name: "celindr_turb"}
  - {id: 27, name: "redukcion_ustr"}
  - {id: 28, name: "bistro_redukc_ustr"}
  - {id: 29, name: "separator_paro"}
  - {id: 30, name: "dearator"}
  - {id: 31, name: "silfonnii_kompensator"}
  - {id: 32, name: "electronagrevat"}
  - {id: 33, name: "smotrowoe_steclo"}
  - {id: 34, name: "datchik"}
  - {id: 35, name: "annotation"}
  - {id: 36, name: "output"}
  - {id: 37, name: "truba"}
  - {id: 38, name: "unknow"}
  - {id: 39, name: "strelka"}
  - {id: 40, name: "background"}
