# =============================================================================
# Правило линии Ду (привязка диаметров)
# =============================================================================
# Диаметр, привязанный оператором к ребру, красит всю ЛИНИЮ этого ребра и
# ничего кроме. Линия строится от привязанного ребра в обе стороны по
# координатам ОРИГИНАЛА:
#
#   узел степени <=2, класс transit  -> идти всегда (колено 90° — та же линия)
#   узел степени >=3, класс transit  -> только коллинеарное продолжение
#                                       (|180°-a| <= collinear_tol_deg), одно, лучшее;
#                                       в отвод не идти
#   класс stop или вне таблицы       -> не идти никогда, при любой степени
#   степень 1                        -> конец линии
#
# Таблица здесь, а не в коде: новый класс не должен требовать правки кода.
# Каждый класс из `classes:` обязан лежать ровно в одном списке — иначе загрузка
# падает с ошибкой. Молча уходить в stop нельзя: это тихо режет линии на новом
# классе, и оператор видит лишний ручной труд вместо ошибки конфига.
diameter_lines:
  # Допуск коллинеарности на врезке, градусы (отклонение направлений от 180°).
  collinear_tol_deg: 30

  # Тупиковый отвод не длиннее no_diameter_max_edges рёбер, оканчивающийся на
  # один из этих классов, Ду не требует: импульсная линия к прибору на чертеже
  # не подписывается. На корпусе 24 схем таких линий 71.
  no_diameter_ends: [datchik]
  no_diameter_max_edges: 3

  # Проход: арматура и приборы врезаны по Ду трубы — диаметр не меняется.
  transit:
    - connector          # служебный узел стыка, в `classes:` его нет
    - armatura_ruchn
    - armatura_electro
    - armatura_seroprivod
    - armatura_membr_electro
    - klapan_obratn
    - klapan_obratn_seroprivod
    - regulator_ruchn
    - regulator_electro
    - regulator_seroprivod
    - predohran            # угловой проходной
    - drossel
    - rashodomernaya_shaiba
    - smotrowoe_steclo
    - silfonnii_kompensator
    - condensatootvod
    - filtr_meh
    - napravlenie          # стрелка на трубе: степень 2 -> сшиваем
    - strelka
    - zaglushka
    - output
    - datchik
    - vozdushnik
    - annotation
    - truba

  # Стоп: аппарат меняет Ду между патрубками либо линия там кончается.
  stop:
    - perehod
    - redukcion_ustr
    - bistro_redukc_ustr
    - nasos
    - vodostruiniy_nasos
    - ventilaytor
    - teploobmen
    - bak
    - dearator
    - separator
    - separator_paro
    - kapleulov
    - gidrozatvor
    - celindr_turb
    - electronagrevat
    - voronka              # конечная
    - unknow               # играем от безопасности
    - background           # не объект схемы

