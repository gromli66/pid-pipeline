[pytest]
testpaths = tests
# collect_ignore здесь не действует — это переменная conftest.py, а не опция
# ini (pytest ругался PytestConfigWarning: Unknown config option). Исключения
# сбора живут в tests/conftest.py.

# Маркеры (пункт 0.3). Ставятся автоматически в tests/conftest.py, руками
# в тест-файлах их проставлять не нужно. --strict-markers превращает опечатку
# в маркере в ошибку сбора, а не в молча пропущенный фильтр.
addopts = --strict-markers
markers =
    ui: тесту нужен Qt/PySide6 (модуль импортирует PySide6). Прогон без Qt:
        pytest -m "not ui" — но сборка всё равно импортирует модуль, так что
        отсутствие PySide6 этим маркером НЕ обходится, он про исполнение.
